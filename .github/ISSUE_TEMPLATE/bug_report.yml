name: Bug report
description: Report a reproducible problem in PR Review Reminder.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove private repository content,
        tokens, and personal information from all logs and screenshots.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "14.6"
    validations:
      required: true
  - type: textarea
    id: cli
    attributes:
      label: CLI versions
      description: Output of gh, claude, or codex version commands, as relevant.
      render: shell
  - type: textarea
    id: logs
    attributes:
      label: Additional context
      description: Add sanitized logs or screenshots if they help explain the problem.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets and private repository content.
          required: true
