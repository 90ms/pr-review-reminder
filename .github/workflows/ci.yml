name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automation-tests:
    name: Test Synology issue automation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install automation package
        run: python -m pip install ./automation/synology

      - name: Test automation
        run: python -m unittest discover -s automation/synology/tests -v

      - name: Validate automation scripts
        run: |
          python -m compileall -q automation/synology/src automation/synology/tests
          sh -n automation/synology/scripts/setup-github-labels.sh
          pr-issue-worker --help

      - name: Build automation image
        run: |
          docker build \
            --file automation/synology/Dockerfile \
            --tag pr-review-issue-worker:test \
            .
          docker run --rm --entrypoint gh pr-review-issue-worker:test \
            auth login --help | grep -q -- --insecure-storage

  build-and-test:
    name: Build, test, and validate app bundle
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Test Homebrew launcher
        run: |
          ./Tests/Scripts/LauncherTests.sh
          ./Tests/Scripts/HomebrewFormulaTests.sh

      - name: Assemble application bundle
        env:
          OUTPUT_DIR: ${{ runner.temp }}/prr-package
          APP_VERSION: 0.0.0-ci
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./Scripts/build-app.sh

      - name: Validate application bundle
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/prr-package/PR Review Reminder.app"
          test -x "$app/Contents/MacOS/PRReviewReminder"
          test -f "$app/Contents/PkgInfo"
          plutil -lint "$app/Contents/Info.plist"
          test "$(defaults read "$app/Contents/Info" CFBundleIdentifier)" = "kr.fastlane.prreviewreminder"
          test "$(defaults read "$app/Contents/Info" CFBundleShortVersionString)" = "0.0.0-ci"
