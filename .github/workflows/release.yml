name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish macOS release
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must use v<semver>, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Determine distribution mode
        id: distribution
        shell: bash
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          values=(
            "$CERTIFICATE_P12_BASE64"
            "$CERTIFICATE_PASSWORD"
            "$KEYCHAIN_PASSWORD"
            "$DEVELOPER_ID_APPLICATION"
            "$APPLE_ID"
            "$APPLE_TEAM_ID"
            "$APPLE_APP_PASSWORD"
          )
          configured=0
          for value in "${values[@]}"; do
            if [[ -n "$value" ]]; then configured=$((configured + 1)); fi
          done
          if [[ "$configured" -eq 0 ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Building an ad-hoc signed release (Developer ID is not configured)."
          elif [[ "$configured" -eq "${#values[@]}" ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Building a Developer ID signed and notarized release."
          else
            echo "Signing configuration is incomplete ($configured/${#values[@]} secrets)." >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        if: ${{ steps.distribution.outputs.signed == 'true' }}
        shell: bash
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/release.keychain-db"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychain -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$keychain"

      - name: Build application
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
          BUILD_NUMBER: ${{ github.run_number }}
          CODE_SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: ./Scripts/build-app.sh

      - name: Create notarization archive
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          ditto -c -k --keepParent \
            "dist/PR Review Reminder.app" \
            "dist/PR-Review-Reminder-$VERSION.zip"

      - name: Notarize and staple
        if: ${{ steps.distribution.outputs.signed == 'true' }}
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_ID:?APPLE_ID is required for notarization}"
          : "${APPLE_TEAM_ID:?APPLE_TEAM_ID is required for notarization}"
          : "${APPLE_APP_PASSWORD:?APPLE_APP_PASSWORD is required for notarization}"
          archive="dist/PR-Review-Reminder-$VERSION.zip"
          xcrun notarytool submit "$archive" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "dist/PR Review Reminder.app"
          rm "$archive"
          ditto -c -k --keepParent \
            "dist/PR Review Reminder.app" \
            "$archive"

      - name: Generate checksum
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 "PR-Review-Reminder-$VERSION.zip" \
            > "PR-Review-Reminder-$VERSION.zip.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
          SIGNED: ${{ steps.distribution.outputs.signed }}
        run: |
          if [[ "$SIGNED" == "true" ]]; then
            security_note="Developer ID signed and Apple-notarized build."
          else
            security_note="Ad-hoc signed build. Homebrew source installation is recommended; direct downloads may require explicit approval in macOS Privacy & Security."
          fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/PR-Review-Reminder-$VERSION.zip" \
            "dist/PR-Review-Reminder-$VERSION.zip.sha256" \
            --generate-notes \
            --notes "$security_note" \
            --verify-tag
