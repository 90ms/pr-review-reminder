http_port 3128

acl CONNECT method CONNECT
acl SSL_ports port 443
acl codex_destinations dstdomain .openai.com .chatgpt.com

http_access allow CONNECT SSL_ports codex_destinations
http_access deny all

cache deny all
access_log stdio:/dev/stdout
cache_log /dev/stderr
pid_filename /tmp/squid.pid
coredump_dir /tmp
