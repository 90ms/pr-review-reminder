services:
  issue-worker:
    build:
      context: ../..
      dockerfile: automation/synology/Dockerfile
    image: pr-review-issue-worker:local
    restart: unless-stopped
    init: true
    user: "${PUID:?Set PUID}:${PGID:?Set PGID}"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      HOME: /home/worker
      DATA_PATH: /data
      STATE_PATH: /data/state.sqlite3
      WORKSPACE_PATH: /data/workspaces
      RUNNER_QUEUE_PATH: /data/runner-queue
      GH_CONFIG_DIR: /home/worker/.config/gh
      SECRET_SCAN_PATHS: /home/worker/.config/gh,/run/codex-auth
    volumes:
      - "${DATA_DIR:?Set DATA_DIR}:/data"
      - "${GH_CONFIG_DIR:?Set GH_CONFIG_DIR}:/home/worker/.config/gh:ro"
      - "${CODEX_HOME_DIR:?Set CODEX_HOME_DIR}:/run/codex-auth:ro"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - controller

  codex-runner:
    build:
      context: ../..
      dockerfile: automation/synology/Dockerfile.runner
      args:
        CODEX_CLI_VERSION: ${CODEX_CLI_VERSION:-0.137.0}
    image: pr-review-codex-runner:local
    restart: unless-stopped
    init: true
    user: "${PUID:?Set PUID}:${PGID:?Set PGID}"
    environment:
      HOME: /home/worker
      CODEX_HOME: /home/worker/.codex
      CODEX_RUNNER_MODE: ${CODEX_RUNNER_MODE:?Set CODEX_RUNNER_MODE}
      RUNNER_QUEUE_PATH: /queue
      WORKSPACE_PATH: /workspaces
      RUNNER_POLL_SECONDS: ${RUNNER_POLL_SECONDS:-1}
      HTTPS_PROXY: http://codex-egress:3128
      HTTP_PROXY: http://codex-egress:3128
      NO_PROXY: localhost,127.0.0.1
    volumes:
      - "${DATA_DIR:?Set DATA_DIR}/runner-queue:/queue"
      - "${DATA_DIR:?Set DATA_DIR}/workspaces:/workspaces"
      - "${CODEX_HOME_DIR:?Set CODEX_HOME_DIR}:/home/worker/.codex"
    read_only: true
    tmpfs:
      - /tmp:size=1024m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 4g
    cpus: 2.0
    depends_on:
      - codex-egress
    networks:
      - runner

  codex-egress:
    build:
      context: ../..
      dockerfile: automation/synology/Dockerfile.egress
    image: pr-review-codex-egress:local
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    networks:
      - runner
      - egress

networks:
  controller:
  runner:
    internal: true
  egress:
