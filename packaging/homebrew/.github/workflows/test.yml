name: Test Formula

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Register tap
        run: brew tap 90ms/tap

      - name: Install Formula from source
        run: brew install --build-from-source 90ms/tap/pr-review-reminder

      - name: Test Formula
        run: brew test 90ms/tap/pr-review-reminder

      - name: Audit Formula
        run: brew audit --strict 90ms/tap/pr-review-reminder
